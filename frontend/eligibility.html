<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eligibility Checker | PlacementPro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🎓 PlacementPro</div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="companies.html">Companies</a>
            <a href="profile.html">Profile</a>
             <button onclick="logout()">Logout</button>
        </nav>
    </header>

    <main class="eligibility-page">

        <div class="eligibility-box">

            <h1>Check Your Eligibility 🎯</h1>

            <p>Enter your CGPA to see eligible companies.</p>

            <label for="cgpa">CGPA</label>
            <input
                type="number"
                id="cgpa"
                placeholder="Enter your CGPA"
                min="0"
                max="10"
                step="0.01"
            >

            <button onclick="checkEligibility()">
                Check Eligibility
            </button>

            <div id="eligibilityResult"></div>

        </div>

    </main>

    <footer>
        <p>© 2026 PlacementPro | Student Placement Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
